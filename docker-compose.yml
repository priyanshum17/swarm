version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: swarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  swarm:
    build: .
    container_name: swarm-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SWARM_HOST=0.0.0.0
      - SWARM_PORT=8000
      - SWARM_ENABLE_PROMPT_CACHING=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SWARM_MODEL=${SWARM_MODEL:-gpt-4o-mini}
      - SWARM_USE_MOCK_LLM=${SWARM_USE_MOCK_LLM:-false}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
